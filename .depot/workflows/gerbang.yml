# stack=npm → .depot/workflows/gerbang.yml
# Gerbang izin di Depot CI (mesin jauh) — dipanggil oleh ~/bin/gerbang-depot.sh (autopilot gerbang_jauh / deploy), bukan push/PR.
# Dijana `~/bin/depot-workflow.sh` dari ~/ops/depot/templat/gerbang-npm.yml (stack: Node + npm, package-lock.json).
# Tiada rahsia: nilai sintetik dalam `env`; pelari Depot TIADA /etc/machine-id.
name: gerbang
on: workflow_dispatch
jobs:
  gerbang:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    env:
      NO_COLOR: "1"
      CI: "1"
      TERM: dumb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: bash scripts/gerbang-ujian.sh
