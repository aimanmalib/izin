# Remote gate: the same script as the local gate and the public CI, run on a larger machine on request.
# Manual dispatch only. It does not run on push or on a pull request.
# No secrets: the job uses recorded fixtures and synthetic values.
name: gerbang
on: workflow_dispatch
jobs:
  gerbang:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    env:
      NO_COLOR: "1"
      CI: "1"
      TERM: dumb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: bash scripts/gerbang-ujian.sh
